<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Result Management</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><p class="eyebrow">ACADEMIC PORTAL</p><h1>Student results</h1></div><span class="term">SEMESTER · 2026</span></header>
<main><section class="summary"><article><p>Total students</p><strong id="total">4</strong></article><article><p>Class average</p><strong id="average">78.0%</strong></article><article><p>Pass rate</p><strong id="pass-rate">75%</strong></article></section>
<section class="panel"><div class="panel-head"><div><h2>Result register</h2><p>Search, add, and review student marks.</p></div><button id="show-add">+ Add student</button></div>
<div class="tools"><input id="search" type="search" placeholder="Search by name or ID..." aria-label="Search students"><select id="filter" aria-label="Filter by result"><option value="all">All results</option><option value="pass">Passed</option><option value="fail">Failed</option></select></div>
<form id="add-form" hidden><input name="id" required placeholder="Student ID"><input name="name" required placeholder="Student name"><input name="marks" type="number" min="0" max="100" required placeholder="Marks (0–100)"><button type="submit">Save</button></form>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>Student</th><th>Marks</th><th>Grade</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" hidden>No matching students.</p><p class="note">Pass mark: 40/100. This is a browser-only demo; refreshing resets changes.</p></section></main><script src="script.js"></script></body></html>
